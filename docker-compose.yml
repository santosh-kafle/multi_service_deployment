services:
  api:
    build: ./api
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - ./api/.env    
    restart: unless-stopped    
  mongo:
    image: mongo:7
    volumes:
        - db_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5    
    restart: unless-stopped  
  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
        - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped  

  web:
    build: ./web
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5 
    restart: unless-stopped 

  proxy:
     build: ./proxy
     ports:
       - "8080:80"
     depends_on:
       web:
            condition: service_healthy
       api:
           condition: service_healthy
     healthcheck:
        test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
        interval: 10s
        timeout: 5s
        retries: 5  
     restart: unless-stopped 
networks:
  default:
    name: app_network


volumes:
  db_data:
  redis_data: