services:
  api:
    build: ./api
    environment:
      MONGO_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongo
      - redis
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5    
  mongo:
    image: mongo:7
    volumes:
        - db_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5    
  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
        - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./web
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5  

  proxy:
     build: ./proxy
     ports:
       - "8080:80"
     depends_on:
        - web
        - api
     healthcheck:
        test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
        interval: 10s
        timeout: 5s
        retries: 5  
networks:
  default:
    name: app_network


volumes:
  db_data:
  redis_data: